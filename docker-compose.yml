# First startup downloads the Stable Diffusion/VAE and Ollama models.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-friend-ollama
    # No published port on purpose: the backend reaches it at http://ollama:11434
    # (avoids a clash if Ollama for Windows is also running on 11434).
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull mistral:latest"
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  model-init:
    build: ./backend
    command: ["python", "download_models.py"]
    volumes:
      - models:/app/models
    restart: "no"

  backend:
    build: ./backend
    container_name: ai-friend-backend
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      MODEL_NAME: mistral:latest
      SD_PATH: models/realistic
      VAE_PATH: models/vae
      DATA_DIR: /app/data
    volumes:
      - models:/app/models
      - media:/app/media
      - data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./ai-friend
    container_name: ai-friend-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  ollama_data:
  models:
  media:
  data:
