services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: https://github.com/calmindian/chatbot.git#main:backend
    depends_on: [ollama]
    ports:
      - "8000:8000"
    environment:
      BASE_URL: http://localhost:8000
      OLLAMA_URL: http://ollama:11434/api/generate
      MODEL_NAME: mistral:latest
      SD_PATH: models/realistic
      VAE_PATH: models/vae
      DATA_DIR: /app/data
    volumes:
      - models:/app/models
      - media:/app/media
      - data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: https://github.com/calmindian/chatbot.git#main:ai-friend
      args:
        REACT_APP_API_URL: http://localhost:8000
    depends_on: [backend]
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  ollama_data:
  models:
  media:
  data:
